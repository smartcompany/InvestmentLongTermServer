name: Portfolio change push

on:
  schedule:
    # Daily 01:00 UTC (10:00 KST)
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call portfolio-change cron API
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is not set"
            exit 1
          fi

          API_BASE_URL="${{ vars.API_BASE_URL }}"
          if [ -z "$API_BASE_URL" ]; then
            API_BASE_URL="https://investment-long-term-server.vercel.app"
          fi

          response=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${API_BASE_URL}/api/cron/portfolio-change")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "$body"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Request failed with status ${http_code}"
            exit 1
          fi
